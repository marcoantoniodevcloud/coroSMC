plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.opensong'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('desktopRun', JavaExec) {
    group = 'application'
    description = 'Run OpenSongWeb locally and open it in the default browser.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.opensong.web.OpenSongWebApplication'
    args '--opensongweb.desktop=true'
    environment 'OPENSONGWEB_SONGS_PATH', providers.environmentVariable('OPENSONGWEB_SONGS_PATH')
            .getOrElse(file('../app/src/main/assets/DefaultSongs').absolutePath)
}

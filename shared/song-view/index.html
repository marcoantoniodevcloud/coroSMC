<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="song-view.css">
<style>
@font-face{font-family:SongMono;src:url("RobotoMono.ttf") format("truetype");font-display:swap}
*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--song-background,#faf8f5);color:var(--song-text,#222);font-family:SongMono,monospace;font-size:18px;line-height:1.55}
header{position:sticky;top:0;z-index:2;background:var(--song-background,#faf8f5);padding:8px 0;border-bottom:1px solid #8885}
h1{font:600 24px system-ui;margin:4px 0;white-space:normal;overflow-wrap:anywhere}#metadata{font:14px system-ui;margin:4px 0}.melody-controls{font-family:system-ui}select,button{padding:8px;border-radius:8px;background:var(--song-background,#fff);color:inherit;border:1px solid #8888}
#preview{overflow-x:auto}.separate-melody{max-height:none;margin-top:12px} .song-sheet{margin-top:12px}.preview-lyrics{color:var(--song-text)}
</style></head><body>
<header><div class="song-heading"><h1 id="title"></h1><button id="view-options-toggle" type="button" aria-label="Opciones de vista" title="Opciones de vista" aria-haspopup="dialog" aria-expanded="false" aria-controls="view-options">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--song-background,#fffdf8)"/><circle cx="15" cy="17" r="3" fill="var(--song-background,#fffdf8)"/></svg></button></div><div id="metadata"></div></header>
<dialog id="view-options" aria-labelledby="view-options-label"><div class="view-options-heading"><h2 id="view-options-label">Opciones de vista</h2><button id="view-options-close" type="button">Listo</button></div><div class="melody-controls">
<label><input id="chords" type="checkbox" checked> <span id="chords-label">Acordes</span></label>
<label><span id="melody-label">Melodía</span> <select id="mode"><option value="inline">Debajo de la letra</option><option value="off">Oculta</option><option value="separate">Panel separado</option></select></label>
<label><span id="size-label">Tamaño</span> <select id="size"><option value="0.85">85%</option><option value="1" selected>100%</option><option value="1.2">120%</option><option value="1.5">150%</option></select></label>
<label>Hoja <select id="theme"><option value="mobile">Clara</option><option value="dark">Oscura</option></select></label></div></dialog>
<main id="sheet" class="song-sheet"><div id="preview"></div><aside id="separate" class="separate-melody" hidden></aside></main>
<script src="melody.js"></script><script src="view.js"></script></body></html>
